# GIST dataset configuration
dataset: gist-960-euclidean
metric: euclidean
n_train: 10000
n_test: 1000

algorithms:
  MANN-LSH:
    n_tables: 20
    hash_length: 8

  MANN-HNSW-diversified:
    M: 16
    ef_construction: 200
    ef_search: 50
    neighbor_policy: diversified

  MANN-IVF-HNSW:
    nlist: 64
    routing_k: 8
    M: 16
    ef_construction: 200
    ef_search: 64
    neighbor_policy: diversified

  MANN-NNDescent-pruned-deferred:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: pruned
    apply_symmetry_continuously: false
    ef_search: 64

  MANN-NNDescent-full-continuous:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: full
    apply_symmetry_continuously: true
    ef_search: 64

  MANN-NNDescent-full-deferred:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: full
    apply_symmetry_continuously: false
    ef_search: 64

  Annoy:
    n_trees: 10

  HNSWlib:
    M: 16
    ef_construction: 200
    ef_search: 50

  FAISS-IVF:
    nlist: 200
    nprobe: 16

  HNSW-jl:
    M: 16
    ef_construction: 200
    ef: 50

  NearestNeighborDescent-jl:
    k: 32
    max_iterations: 5
    sample_rate: 0.5
    precision: 0.01
    max_candidates: 64
