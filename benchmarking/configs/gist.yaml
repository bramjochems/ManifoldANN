# GIST dataset configuration
dataset: gist-960-euclidean
metric: euclidean
n_train: 10000
n_test: 1000

algorithms:
  MANN-LSH:
    n_tables: 20
    hash_length: 10

  MANN-HNSW-diversified:
    M: 16
    ef_construction: 200
    ef_search: 50
    neighbor_policy: diversified

  MANN-IVF-HNSW:
    nlist: 64
    routing_k: 8
    M: 16
    ef_construction: 200
    ef_search: 64
    neighbor_policy: diversified

  MANN-NNDescent-full-deferred:
    k: 32
    max_iterations: 15
    convergence_threshold: 0.01
    sample_rate: 1.0
    symmetry_policy: full
    apply_symmetry_continuously: false
    ef_search: 64
    threaded: true
    init: rptree

  Annoy:
    n_trees: 100

  HNSWlib:
    M: 16
    ef_construction: 200
    ef_search: 50

  FAISS-IVF:
    nlist: 200
    nprobe: 16
