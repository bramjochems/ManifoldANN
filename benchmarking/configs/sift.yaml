# SIFT dataset configuration
dataset: sift-128-euclidean
metric: euclidean
n_train: 10000
n_test: 1000

algorithms:
  ManifoldANN-BruteForce: {}

  ManifoldANN-LSH:
    n_tables: 20
    hash_length: 8

  ManifoldANN-HNSW-heuristic:
    M: 16
    ef_construction: 200
    ef_search: 50
    neighbor_policy: heuristic

  ManifoldANN-HNSW-diversified:
    M: 16
    ef_construction: 200
    ef_search: 50
    neighbor_policy: diversified

  ManifoldANN-KDTree:
    axis_selector: variance

  ManifoldANN-NNDescent:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: pruned
    ef_search: 64

  Annoy:
    n_trees: 10

  HNSWlib:
    M: 16
    ef_construction: 200
    ef_search: 50

  FAISS-IVF:
    nlist: 100
    nprobe: 10

  SciPy-KDTree:
    leafsize: 32

  HNSW-jl:
    M: 16
    ef_construction: 200
    ef: 50

  NearestNeighborDescent-jl:
    k: 32
    max_iterations: 5
    sample_rate: 0.5
    precision: 0.01
    max_candidates: 64
