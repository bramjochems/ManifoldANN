# GloVe-100 dataset configuration
dataset: glove-100-angular
metric: angular
n_train: 10000
n_test: 1000

algorithms:
  MANN-BruteForce: {}

  MANN-LSH:
    n_tables: 16
    hash_length: 6

  # MANN-HNSW-heuristic:
  #   M: 16
  #   ef_construction: 200
  #   ef_search: 50
  #   neighbor_policy: heuristic

  MANN-HNSW-diversified:
    M: 16
    ef_construction: 200
    ef_search: 50
    neighbor_policy: diversified

  MANN-IVF-HNSW:
    nlist: 128
    routing_k: 10
    M: 16
    ef_construction: 200
    ef_search: 64
    neighbor_policy: diversified

  # MANN-NNDescent-pruned-continuous:
  #   k: 32
  #   max_iterations: 5
  #   convergence_threshold: 0.01
  #   sample_rate: 0.5
  #   symmetry_policy: pruned
  #   apply_symmetry_continuously: true
  #   ef_search: 64

  MANN-NNDescent-pruned-deferred:
    k: 32
    max_iterations: 15
    convergence_threshold: 0.01
    sample_rate: 1.0
    symmetry_policy: pruned
    apply_symmetry_continuously: false
    ef_search: 64
    threaded: true

  MANN-NNDescent-full-continuous:
    k: 32
    max_iterations: 15
    convergence_threshold: 0.01
    sample_rate: 1.0
    symmetry_policy: full
    apply_symmetry_continuously: true
    ef_search: 64
    threaded: true

  MANN-NNDescent-full-deferred:
    k: 32
    max_iterations: 15
    convergence_threshold: 0.01
    sample_rate: 1.0
    symmetry_policy: full
    apply_symmetry_continuously: false
    ef_search: 64
    threaded: true

  Annoy:
    n_trees: 10

  HNSWlib:
    M: 16
    ef_construction: 200
    ef_search: 50

  FAISS-IVF:
    nlist: 100
    nprobe: 10

  HNSW-jl:
    M: 16
    ef_construction: 200
    ef: 50

  NearestNeighborDescent-jl:
    k: 32
    max_iterations: 15
    sample_rate: 1.0
    precision: 0.01
    max_candidates: 64
