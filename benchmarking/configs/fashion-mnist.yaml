# Fashion-MNIST dataset configuration
dataset: fashion-mnist-784-euclidean
metric: euclidean
n_train: 10000
n_test: 1000

algorithms:
  MANN-BruteForce: {}

  MANN-LSH:
    n_tables: 16
    hash_length: 7

  # MANN-HNSW-heuristic:
  #   M: 16
  #   ef_construction: 200
  #   ef_search: 50
  #   neighbor_policy: heuristic

  MANN-HNSW-diversified:
    M: 16
    ef_construction: 200
    ef_search: 50
    neighbor_policy: diversified

  MANN-IVF-HNSW:
    nlist: 100
    routing_k: 8
    M: 16
    ef_construction: 200
    ef_search: 64
    neighbor_policy: diversified
  MANN-IVF-Flat:
    nlist: 100
    nprobe: 10

  MANN-KDTree:
    axis_selector: variance

  # MANN-NNDescent-pruned-continuous:
  #   k: 32
  #   max_iterations: 5
  #   convergence_threshold: 0.01
  #   sample_rate: 0.5
  #   symmetry_policy: pruned
  #   apply_symmetry_continuously: true
  #   ef_search: 64

  MANN-NNDescent-pruned-deferred:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: pruned
    apply_symmetry_continuously: false
    ef_search: 64

  MANN-NNDescent-full-continuous:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: full
    apply_symmetry_continuously: true
    ef_search: 64

  MANN-NNDescent-full-deferred:
    k: 32
    max_iterations: 5
    convergence_threshold: 0.01
    sample_rate: 0.5
    symmetry_policy: full
    apply_symmetry_continuously: false
    ef_search: 64

  Annoy:
    n_trees: 10

  HNSWlib:
    M: 16
    ef_construction: 200
    ef_search: 50

  FAISS-IVF:
    nlist: 100
    nprobe: 10

  SciPy-KDTree:
    leafsize: 32

  # PyNNDescent - EXCLUDED (requires Python <3.10)
  # To re-enable: uncomment below and add back to registry.py
  # PyNNDescent:
  #   n_neighbors: 30
  #   diversify_prob: 1.0
  #   pruning_degree_multiplier: 1.5

  # NearestNeighbors-KDTree:
  #   leafsize: 10

  HNSW-jl:
    M: 16
    ef_construction: 200
    ef: 50


  NearestNeighborDescent-jl:
    k: 32
    max_iterations: 5
    sample_rate: 0.5
    precision: 0.01
    max_candidates: 64
