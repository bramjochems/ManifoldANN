# Algorithm Metadata
#
# This file defines metadata for all available algorithms.
# Each algorithm specifies:
#   - name: Display name
#   - source: Library/package name
#   - language: Implementation language
#   - type: Algorithm category
#   - description: Brief description

algorithms:
  MANN-BruteForce:
    name: Brute Force
    source: ManifoldANN
    language: Julia
    type: exact
    description: Exact nearest neighbor search (baseline)

  MANN-LSH:
    name: LSH
    source: ManifoldANN
    language: Julia
    type: hash
    description: Locality Sensitive Hashing (auto hash family selection)

  MANN-KDTree:
    name: KD-Tree
    source: ManifoldANN
    language: Julia
    type: tree
    description: Space partitioning tree

  MANN-RPForest:
    name: RP-Tree Forest
    source: ManifoldANN
    language: Julia
    type: tree
    description: Random projection tree forest with brute-force scoring of leaf union

  MANN-HNSW:
    name: HNSW
    source: ManifoldANN
    language: Julia
    type: graph
    description: Hierarchical Navigable Small World graphs
  MANN-IVF-HNSW:
    name: IVF + HNSW
    source: ManifoldANN
    language: Julia
    type: quantization
    description: KMeans coarse quantization with HNSW per cluster
  MANN-IVF-Flat:
    name: IVF-Flat
    source: ManifoldANN
    language: Julia
    type: quantization
    description: IVF-Flat index optimized for speed (KMeans + inverted lists)

  MANN-NNDescent:
    name: NN-Descent
    source: ManifoldANN
    language: Julia
    type: graph
    description: Nearest Neighbor Descent graph construction
    threaded: true

  MANN-NNDescent-pruned-continuous:
    name: NN-Descent (pruned, continuous)
    source: ManifoldANN
    language: Julia
    type: graph
    description: NN-Descent with pruned symmetry applied continuously
    threaded: true

  MANN-NNDescent-pruned-deferred:
    name: NN-Descent (pruned, deferred)
    source: ManifoldANN
    language: Julia
    type: graph
    description: NN-Descent with pruned symmetry applied at end
    threaded: true

  MANN-NNDescent-full-continuous:
    name: NN-Descent (full, continuous)
    source: ManifoldANN
    language: Julia
    type: graph
    description: NN-Descent with full symmetry applied continuously
    threaded: true

  MANN-NNDescent-full-deferred:
    name: NN-Descent (full, deferred)
    source: ManifoldANN
    language: Julia
    type: graph
    description: NN-Descent with full symmetry applied at end
    threaded: true

  Annoy:
    name: Annoy
    source: Spotify/Annoy
    language: C++
    type: tree
    description: Approximate Nearest Neighbors Oh Yeah

  HNSWlib:
    name: HNSWlib
    source: nmslib/hnswlib
    language: C++
    type: graph
    description: Fast HNSW implementation

  FAISS-IVF:
    name: FAISS IVF
    source: Meta/FAISS
    language: C++
    type: quantization
    description: Inverted File with product quantization

  SciPy-KDTree:
    name: SciPy KDTree
    source: SciPy
    language: Python/C
    type: tree
    description: Standard KD-Tree (exact, Euclidean only)

  PyNNDescent:
    name: PyNNDescent
    source: lmcinnes/pynndescent
    language: Python
    type: graph
    description: Python NN-Descent implementation (numba JIT)

  NearestNeighbors-KDTree:
    name: NN.jl KDTree
    source: NearestNeighbors.jl
    language: Julia
    type: tree
    description: KD-Tree from NearestNeighbors.jl

  HNSW-jl:
    name: HNSW.jl
    source: HNSW.jl
    language: Julia
    type: graph
    description: Pure Julia HNSW implementation

  NearestNeighborDescent-jl:
    name: NN-Descent (Julia)
    source: NearestNeighborDescent.jl
    language: Julia
    type: graph
    description: Julia NN-Descent implementation
