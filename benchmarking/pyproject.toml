[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifoldann-benchmarks"
version = "0.1.0"
description = "Benchmarking suite for ManifoldANN and comparison with other ANN libraries"
authors = [
    {name = "Bram Jochems", email = "bram.jochems@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "juliacall>=0.9.0",
    "numpy>=1.20.0",
    "h5py>=3.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
# Optional third-party ANN libraries for comparison
annoy = ["annoy>=1.17.0"]
hnswlib = ["hnswlib>=0.7.0"]
faiss = ["faiss-cpu>=1.7.0"]
scipy = ["scipy>=1.7.0"]
pynndescent = ["pynndescent>=0.5.0"]

# All optional dependencies
all = [
    "annoy>=1.17.0",
    "hnswlib>=0.7.0",
    "faiss-cpu>=1.7.0",
    "scipy>=1.7.0",
    "pynndescent>=0.5.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
manifoldann-benchmark = "benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarking*"]
exclude = ["benchmarking.ann-benchmarks*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py38"
