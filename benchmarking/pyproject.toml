[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifoldann-benchmarks"
version = "0.1.0"
description = "Benchmarking suite for ManifoldANN and comparison with other ANN libraries"
authors = [
    {name = "Bram Jochems", email = "bram.jochems@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "juliacall>=0.9.0",
    "numpy>=1.20.0",
    "h5py>=3.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
# Individual ANN libraries for comparison
annoy = ["annoy>=1.17.0"]
hnswlib = ["hnswlib>=0.7.0"]
faiss = ["faiss-cpu>=1.7.0"]
scipy = ["scipy>=1.7.0"]
# Note: pynndescent requires llvmlite which only supports Python <3.10
# This forces the entire environment to Python 3.9, which isn't fair for modern comparisons
pynndescent = ["pynndescent>=0.5.0"]

# ORC (Ollivier-Ricci Curvature) benchmarking - Python implementations for comparison
orc = [
    "networkx>=2.5.0",
    "GraphRicciCurvature>=0.5.0",
    "POT>=0.9.0",
    "pandas>=1.5.0",
]

# Modern ANN comparison (Python 3.10+) - excludes pynndescent
ann-modern = [
    "annoy>=1.17.0",
    "hnswlib>=0.7.0",
    "faiss-cpu>=1.7.0",
    "scipy>=1.7.0",
]

# Complete ANN comparison (Python 3.9 only) - includes pynndescent
ann-complete = [
    "annoy>=1.17.0",
    "hnswlib>=0.7.0",
    "faiss-cpu>=1.7.0",
    "scipy>=1.7.0",
    "pynndescent>=0.5.0",
]

# For ORC benchmarking only (no ANN dependencies needed)
orc-only = [
    "networkx>=2.5.0",
    "GraphRicciCurvature>=0.5.0",
    "POT>=0.9.0",
    "pandas>=1.5.0",
]

# Everything except pynndescent (works on Python 3.10+)
all = [
    "annoy>=1.17.0",
    "hnswlib>=0.7.0",
    "faiss-cpu>=1.7.0",
    "scipy>=1.7.0",
    "networkx>=2.5.0",
    "GraphRicciCurvature>=0.5.0",
    "POT>=0.9.0",
    "pandas>=1.5.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
manifoldann-benchmark = "benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarking*"]
exclude = ["benchmarking.ann-benchmarks*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py38"
